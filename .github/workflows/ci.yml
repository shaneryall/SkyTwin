name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.95"

# Every action is pinned to a full commit SHA with its version as a comment; keep the comments.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Third-party licence notices are current
        run: python3 scripts/third_party_licenses.py --check
      - name: The README quick start, in a fresh checkout
        run: |
          cargo run --release --locked -p skytwin-cli -- examples/two-streaks.json out/two-streaks.fits
          test -s out/two-streaks.truth.json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Oldest supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\([0-9.]*\)".*/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup default "$msrv"
      - run: cargo test --workspace --locked

  # The same scene and seed must give the same pixels on every platform: each runner renders
  # the reference scenes and the hashes of the outputs are compared in the next job.
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: cargo test --workspace --release --locked
      - name: Render the reference scenes and hash their pixels
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          mkdir -p pixels
          for s in two-streaks dirty-frame track-rate; do
            cargo run --release --locked -q -p skytwin-cli -- "examples/$s.json" "out/$s.fits"
            python scripts/pixel_hash.py "out/$s.fits" >> "pixels/$OS.txt"
          done
          cat "pixels/$OS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixels-${{ matrix.os }}
          path: pixels/

  same-pixels:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pixels-*
          merge-multiple: true
      - name: Every platform gave the same pixels
        run: |
          cat *.txt
          test "$(cat *.txt | sort -u | wc -l)" -eq 3

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Tools
        run: python -m pip install "maturin==1.16.0" "ruff==0.17.6" "pytest==9.2.0" "numpy==2.5.5"
      - run: ruff check tools/calibrate crates/skytwin-py
      - run: ruff format --check tools/calibrate crates/skytwin-py
      - run: cargo build --release --locked -p skytwin-cli
      - name: Calibration tests
        run: |
          python -m pip install -e 'tools/calibrate[test]'
          PATH="$PWD/target/release:$PATH" python -m pytest tools/calibrate/tests
      - name: Binding tests
        run: |
          python -m venv .venv
          (cd crates/skytwin-py && VIRTUAL_ENV="$PWD/../../.venv" PATH="$PWD/../../.venv/bin:$PATH" maturin develop --release --locked)
          .venv/bin/pip install "pytest==9.2.0" "numpy==2.5.5"
          PATH="$PWD/target/release:$PATH" .venv/bin/python -m pytest crates/skytwin-py/tests

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licenses, advisories and sources of every dependency (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
