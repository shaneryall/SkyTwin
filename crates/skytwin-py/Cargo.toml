[package]
name = "skytwin-py"
description = "Python bindings for Skytwin: stream simulated frames and labels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
skytwin-core.workspace = true
serde_json.workspace = true
# abi3: one wheel per OS serves CPython 3.10 and every later version.
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[features]
# Set by maturin when building the extension module (pyproject.toml).
extension-module = ["pyo3/extension-module"]

# Not the workspace lints: PyO3's generated code uses `unsafe`, which the
# workspace forbids. This crate's own code has none.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel and float arithmetic converts between integer and float types by
# design; the values involved stay far inside both ranges.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Maths written as in its sources: x, y, dx, dy, a, b.
many_single_char_names = "allow"
similar_names = "allow"
# Tests assert bit-for-bit reproducibility.
float_cmp = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
