site_name: Skytwin
site_description: Synthetic star-field images with satellite streaks, instrument defects and an exact answer key for every frame.
site_url: https://shaneryall.github.io/SkyTwin/
repo_url: https://github.com/shaneryall/SkyTwin
repo_name: shaneryall/SkyTwin
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
validation:
  anchors: warn

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

extra:
  version:
    provider: mike

hooks:
  - scripts/docs/hooks.py

plugins:
  - search
  # llms.txt at the site root: a Markdown index for AI tools (llmstxt.org).
  - llmstxt:
      markdown_description: >-
        Skytwin renders synthetic star-field images with satellite streaks and instrument
        defects, and writes an exact truth file for every frame: each star, streak and target
        with its position, flux, drawn path and signal-to-noise ratio. Instrument profiles hold
        every detector defect as a setting, skytwin-calibrate learns a profile from real frames,
        and skytwin-export turns frames into YOLO or COCO training sets.
      sections:
        Get started:
          - index.md
          - tutorials/first-training-set.ipynb
        Guides:
          - export-training-data.md
          - override-a-profile.md
          - learn-a-profile.md
        Reference:
          - scene-format.md
          - reference/profile.md
          - labels.md
          - reference/calibrate.md
          - reference/cli.md
          - reference/python-api.md
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/skytwin-py/python]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Heading anchors as GitHub makes them, so one link works in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences
  - github-callouts

nav:
  - Home: index.md
  - Get started:
      - "Tutorial: your first training set": tutorials/first-training-set.ipynb
  - Guides:
      - Export a training set: export-training-data.md
      - Use and override an instrument profile: override-a-profile.md
      - Learn a profile from real frames: learn-a-profile.md
  - Reference:
      - Scene, truth and headers: scene-format.md
      - Instrument profiles: reference/profile.md
      - Labels: labels.md
      - skytwin-calibrate: reference/calibrate.md
      - Command-line reference: reference/cli.md
      - Python API: reference/python-api.md
      - Versioning: versioning.md
      - Algorithm sources: references.md
      - Changelog: reference/changelog.md
  - How Skytwin works:
      - Realism: design/realism.md
      - Labels: design/labels.md
      - Calibration: design/calibration.md
      - Validation and reproducibility: validation.md
